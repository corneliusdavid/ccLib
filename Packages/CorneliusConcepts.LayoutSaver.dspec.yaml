# DPM package spec file
min dpm client version: 1.0.0
metadata:
  id: CorneliusConcepts.LayoutSaver
  version: 1.0.0
  description: Cornelius Concepts LayoutSaver for VCL
  authors: [ David Cornelius ]
  projectUrl: https://github.com/corneliusdavid/ccLib
  repositoryUrl: https://github.com/corneliusdavid/ccLib
  license: MIT
  copyright: David Cornelius and contributors
  frameworks:
    - vcl
targetPlatforms:
  - compiler from: delphixe2
    compiler to: delphi13.0
    platforms: [ Win32, Win64 ]
templates:
  - name: default
    source:
      - src: ./../source/layoutsaver/*.pas
      - src: ./../source/*.inc
      - src: ./**.dpk
      - src: ./**.dproj
    build:
      - project: ./cc.LayoutSaver_R.dproj
        libSuffix: $libsuffix$
        platforms: [ win32, win64 ]
    design:
      - project: ./cc.LayoutSaver_D.dproj
        libSuffix: $libsuffix$
        platforms: [ win32 ]
